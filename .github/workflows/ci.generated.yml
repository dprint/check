# GENERATED BY ./ci.ts -- DO NOT DIRECTLY EDIT

name: CI
on:
  - push
  - pull_request
jobs:
  style:
    runs-on: "${{ matrix.os }}"
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    steps:
      - name: Use LF line endings
        run: |-
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check formatting latest
        uses: ./
      - name: Check formatting specific version
        uses: ./
        with:
          dprint-version: 0.49.1
      - name: Check formatting specific config
        uses: ./
        with:
          config-path: dprint.json
      - name: Check formatting specific version and config
        uses: ./
        with:
          dprint-version: 0.49.1
          config-path: dprint.json
      - name: Check formatting with cache
        uses: ./
        with:
          cache: true
      - name: Check formatting with cache and specific version
        uses: ./
        with:
          cache: true
          dprint-version: 0.49.1
      - name: Make poorly-formatted json file
        run: 'echo ''{"a": 1, "b": 2}'' > poorly-formatted.json'
      - name: Check formatting with excludes
        uses: ./
        with:
          args: "--excludes poorly-formatted.json"
      - name: Later steps can run dprint with the same cache
        run: |-
          test -n "$DPRINT_CACHE_DIR"
          test -d "$DPRINT_CACHE_DIR/plugins"
          dprint --version
  cache-prime:
    runs-on: "${{ matrix.os }}"
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    steps:
      - name: Use LF line endings
        run: |-
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create unique config and poorly-formatted file
        run: |-
          {
            echo "// ${{ github.run_id }}-${{ github.run_attempt }}"
            cat dprint.json
          } > cache-test.json
          echo '{"a": 1, "b": 2}' > poorly-formatted.json
      - name: Check formatting (expected to fail)
        id: check
        uses: ./
        continue-on-error: true
        with:
          cache: true
          config-path: cache-test.json
      - name: Verify the check failed
        run: 'test "${{ steps.check.outcome }}" = "failure"'
  cache-hit:
    needs:
      - cache-prime
    runs-on: "${{ matrix.os }}"
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    steps:
      - name: Use LF line endings
        run: |-
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Recreate unique config
        run: |-
          {
            echo "// ${{ github.run_id }}-${{ github.run_attempt }}"
            cat dprint.json
          } > cache-test.json
      - name: Check formatting
        id: check
        uses: ./
        with:
          cache: true
          config-path: cache-test.json
      - name: Verify the cache saved by the failed cache-prime job was restored
        env:
          MATCHED_KEY: "${{ steps.check.outputs.cache-matched-key }}"
          EXPECTED_KEY: 'dprint-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''cache-test.json'') }}-cache-prime-${{ github.run_id }}-${{ github.run_attempt }}'
        run: |-
          echo "matched key: $MATCHED_KEY"
          echo "expected:    $EXPECTED_KEY"
          test "$MATCHED_KEY" = "$EXPECTED_KEY"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
      - name: Lint CI generation
        run: ./.github/workflows/ci.ts --lint
